let state={mode:'3',day:0,logs:{},sessions:[],swaps:{},activeId:null},page='train',deadline=0,playing=null,frame={};
try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');state={...state,...v};if(!P[state.mode]||!P[state.mode][state.day]){state.mode='3';state.day=0}}catch(e){}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){document.getElementById('toast').textContent=t}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));toast('Saved on this device')}catch(e){toast('Save failed — export backup')}}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function current(){return state.sessions.find(s=>s.id===state.activeId&&!s.finished)}
function begin(){let c=current();if(!c){c={id:Date.now().toString(),date:today(),name:P[state.mode][state.day][0],mode:state.mode};state.sessions.push(c);state.activeId=c.id;save()}return c}
function rows(id){let c=current();return c?state.logs[c.id+':'+id]||[{},{}]:[{},{}]}
function log(id,i,f,value){let c=begin(),k=c.id+':'+id;state.logs[k]??=[{kg:'',reps:'',done:false},{kg:'',reps:'',done:false}];state.logs[k][i][f]=value;save();progress()}
function previous(id){let c=current();let all=Object.entries(state.logs).filter(([k])=>k.endsWith(':'+id)&&(!c||!k.startsWith(c.id+':')));return all.length?all.at(-1)[1].map(r=>`${r.kg||'—'} lb × ${r.reps||'—'}`).join(' / '):'No previous sets'}
function stop(){clearInterval(playing);playing=null;document.querySelectorAll('[data-play]').forEach(b=>{b.textContent='Play picture sequence';b.setAttribute('aria-pressed','false')})}
function show(id,n){frame[id]=(n+2)%2;document.getElementById('demo-'+id).src=E[id].frames[frame[id]];document.getElementById('caption-'+id).textContent='Picture '+(frame[id]+1)+' of 2 — reference still, not full motion'}
function play(id){let was=playing&&document.getElementById('play-'+id)?.getAttribute('aria-pressed')==='true';stop();if(was)return;let b=document.getElementById('play-'+id);b.textContent='Pause sequence';b.setAttribute('aria-pressed','true');playing=setInterval(()=>show(id,(frame[id]||0)+1),1600)}
function switchDay(i){stop();state.day=i;state.activeId=null;save();render()}
function switchMode(m){state.mode=m;state.day=0;state.activeId=null;save();render()}
function nav(p){page=p;render()}
function card(id,i){let e=E[id];frame[id]=0;return `<article class="card"><span class="tag">EXERCISE ${i+1}</span><h2>${esc(e.name)}</h2><p>2 working sets · 8–12 reps · rest 90–120 seconds</p><div class="photos">${e.frames.map((src,j)=>`<figure><img src="${src}" alt="${esc(e.name)} reference picture ${j+1}" loading="lazy"><figcaption>Reference picture ${j+1}</figcaption></figure>`).join('')}</div><small>Original-guide illustrations. Match the equipment before using; these are reference stills, not verified full-motion demonstrations.</small><details><summary>Open larger pictures & step-by-step instructions</summary><div class="demo"><img id="demo-${id}" src="${e.frames[0]}" alt="${esc(e.name)} enlarged reference"><p id="caption-${id}">Picture 1 of 2 — reference still, not full motion</p></div><div class="flex"><button onclick="show('${id}',0)">Picture 1</button><button onclick="show('${id}',1)">Picture 2</button><button id="play-${id}" data-play aria-pressed="false" onclick="play('${id}')">Play picture sequence</button></div><ol>${e.steps.map(t=>'<li>'+esc(t)+'</li>').join('')}</ol><p class="muted">Machine designs and setup differ. Ask gym staff to check your setup. No verified video is bundled.</p><a target="_blank" rel="noopener" href="https://www.acefitness.org/resources/everyone/exercise-library/">Open ACE exercise library for additional references</a></details><p class="muted">Previous: ${esc(previous(id))}</p>${id==='row'?'<small>Updated to cable row to match the original cable-row pictures. Earlier machine-row logs may use a different machine.</small>':''}<table><thead><tr><th style="width:14%">Set</th><th>Weight (lb)</th><th>Reps</th><th style="width:18%">Done</th></tr></thead><tbody>${rows(id).map((r,n)=>`<tr><td>${n+1}</td><td><input aria-label="${esc(e.name)} set ${n+1} pounds" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(r.kg)}" onchange="log('${id}',${n},'kg',this.value)"></td><td><input aria-label="Set ${n+1} reps" type="number" inputmode="numeric" min="0" max="100" value="${esc(r.reps)}" onchange="log('${id}',${n},'reps',this.value)"></td><td><input aria-label="Set ${n+1} done" type="checkbox" ${r.done?'checked':''} onchange="log('${id}',${n},'done',this.checked);if(this.checked)timer(90)"></td></tr>`).join('')}</tbody></table><details><summary>Equipment busy?</summary><p>Do another listed exercise first, then return. Automatic substitutions are not included: do not use pictures from another exercise as a match.</p></details></article>`}
function progress(){let c=current();let n=c?Object.entries(state.logs).filter(([k])=>k.startsWith(c.id+':')).flatMap(([,v])=>v).filter(r=>r.done).length:0;let el=document.getElementById('progress');if(el){el.value=n;document.getElementById('count').textContent=n+' sets completed'}}
function render(){stop();const a=document.getElementById('app');if(page==='history'){a.innerHTML='<h2>Workout history</h2><p>Started sessions are kept even if unfinished. Back up regularly.</p>'+state.sessions.slice().reverse().map(c=>`<section><h3>${esc(c.name)}</h3><small>${esc(c.date)} · ${c.finished?'Finished':'Started'}</small>${Object.entries(state.logs).filter(([k])=>k.startsWith(c.id+':')).map(([k,rs])=>`<p>${esc(E[k.split(':')[1]]?.name||'Exercise')}: ${rs.map(r=>`${esc(r.kg||'—')} lb × ${esc(r.reps||'—')} ${r.done?'✓':''}`).join(' / ')}</p>`).join('')}</section>`).join('');return}
if(page==='help'){a.innerHTML=`<h2>Help & backup</h2><section><h3>Protect your records</h3><p>Logs stay in this browser. They are not uploaded to GitHub and do not automatically sync to another device. Clearing browser storage can erase them.</p><button onclick="backup()">Export backup</button><p><label>Restore backup (replaces current records)<input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label></p></section><section><h3>How to use this guide</h3><p>General adult starter templates, not an individual medical or rehabilitation plan. Begin with manageable loads and leave a few repetitions in reserve. Increase only when you can complete both sets comfortably and consistently.</p><p>Do not train through sharp or worsening pain, especially a lower-back tweak. Seek individual advice if pain persists.</p><h3>About the pictures</h3><p>Pictures are embedded from your uploaded original guide using direct exercise keys, not its mismatched alias mappings. They are reference illustrations, not professionally certified technique. No full-motion videos or animations are included. Playing alternates two stills only.</p><p>You must have permission to publicly republish the original illustrations. Their licensing was not provided. They can be replaced later with licensed media.</p><h3>Offline & installation</h3><p>On the published HTTPS site, load once online, then reopen once before testing offline. External links need internet. Safari → Share → Add to Home Screen. If you still see the old version, refresh Safari online. Version label should read 3.0 Visual.</p><p><a target="_blank" rel="noopener" href="https://www.acefitness.org/resources/everyone/exercise-library/">ACE exercise references</a></p></section>`;return}
let d=P[state.mode][state.day];a.innerHTML=`<section><h2>Your weekly plan</h2><label>Weekly schedule <select onchange="switchMode(this.value)"><option value="3" ${state.mode==='3'?'selected':''}>3 days · Full body</option><option value="5" ${state.mode==='5'?'selected':''}>5 days · Upper/lower + optional day</option></select></label><p class="muted">${state.mode==='3'?'Example: Monday / Wednesday / Friday, with rest between sessions.':'Example: Mon upper / Tue lower / Wed rest / Thu upper / Fri lower / Sat optional / Sun rest.'}</p><nav>${P[state.mode].map((x,i)=>`<button class="${state.day===i?'active':''}" onclick="switchDay(${i})">${i+1}. ${esc(x[0])}</button>`).join('')}</nav></section><h2>${esc(d[0])}</h2><p>Plan around 45–60 minutes. Timing is an estimate; optional extras can wait.</p><section class="notice"><h3>Start here</h3><p>5–8 minutes of easy movement, followed by light practice sets before the first working sets. Use controlled loads and comfortable ranges. If your lower back is painful, do not push through it.</p><small>Pictures are restored, but not certified technique or continuous-motion demonstrations. Ask a trainer to check unfamiliar exercises.</small></section><section><span id="count">0 sets completed</span><progress id="progress" max="${d[1].length*2}" value="0"></progress><p>${current()?'Session in progress.':'Your first log starts a session.'}</p></section>${d[1].map(card).join('')}<section><h3>Optional finish</h3><p>5–15 minutes of easy walking, cycling or elliptical if time and energy allow. Skip this rather than rushing your lifting.</p><button class="primary" onclick="finish()">Finish session & next workout →</button></section>`;progress()}
function finish(){let c=begin();c.finished=true;state.activeId=null;state.day=(state.day+1)%P[state.mode].length;save();render();window.scrollTo(0,0)}
function timer(n){deadline=n?Date.now()+n*1000:0;tick()}
function tick(){let t=deadline?Math.max(0,Math.ceil((deadline-Date.now())/1000)):0;document.getElementById('clock').textContent=deadline?(t?`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')} rest`:'Rest complete'):'Rest ready';if(deadline&&!t)deadline=0}setInterval(tick,500);
function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify({version:2,data:state},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='gym-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function restore(f){if(!f)return;try{if(f.size>5000000)throw Error('Backup too large');let b=JSON.parse(await f.text()),v=b.data;if(b.version!==2||!v||!P[v.mode]||!Number.isInteger(v.day)||!P[v.mode][v.day]||!Array.isArray(v.sessions)||!v.logs||Array.isArray(v.logs)||typeof v.logs!=='object')throw Error('Invalid backup');for(let [k,rs] of Object.entries(v.logs)){if(!Array.isArray(rs)||rs.length!==2||!rs.every(r=>r&&typeof r==='object'&&['string','number','undefined'].includes(typeof r.kg)&&['string','number','undefined'].includes(typeof r.reps)))throw Error('Invalid set data')}if(!confirm('Replace current records with this backup?'))return;state={...v,activeId:null};save();page='history';render()}catch(e){alert('Restore failed: '+e.message)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>toast('Offline cache unavailable'))}
</script></body></html>
