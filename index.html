<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>My Gym Guide</title><style>
:root{font-family:system-ui,sans-serif;color:#edf3fa;background:#0a1220;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:20px 16px 100px}header{padding:20px;background:#101b2b;border-bottom:1px solid #334155}header>div{max-width:728px;margin:auto}h1{margin:0;font-size:27px}h2{font-size:21px}h3{margin:5px 0 10px}p{line-height:1.6}small,.muted{color:#aec0d5}button,select,input{font:inherit;border:1px solid #506178;border-radius:10px;min-height:44px;padding:10px;background:#17263b;color:white}button{cursor:pointer}button.active,.primary{background:#5ee2b5;color:#08251d;border-color:#5ee2b5;font-weight:700}button:focus-visible,a:focus-visible{outline:3px solid #ffc56b}a{color:#8fcaff}nav,.flex{display:flex;gap:8px;flex-wrap:wrap}section,.card{background:#101e30;border:1px solid #2d415a;border-radius:16px;padding:16px;margin:14px 0}.notice{border-left:4px solid #ffc56b;background:#29251c}.tag{font-size:13px;color:#5ee2b5}details{margin:12px 0}summary{padding:12px 0;cursor:pointer}ol{padding-left:23px;line-height:1.7}li{padding:5px}label{display:block}table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left}td input[type=number]{width:100%;min-width:60px}input[type=checkbox]{width:26px;height:26px;min-height:26px;accent-color:#5ee2b5}progress{width:100%;height:14px;accent-color:#5ee2b5}footer{position:fixed;bottom:0;left:0;right:0;padding:10px max(12px,env(safe-area-inset-left));background:#15253bf2;border-top:1px solid #506178;display:flex;justify-content:center;gap:10px;align-items:center}#status{min-height:24px;color:#5ee2b5}input[type=file]{max-width:100%}.step{border-radius:12px;border:1px solid #536984;padding:16px;background:#172b43;min-height:110px;font-size:17px}.badge{font-size:12px;color:#ffce85}#toast{font-size:13px} .done{opacity:.65}@media(max-width:400px){main{padding:12px 10px 100px}td,th{padding:4px}button{padding:9px}}</style></head><body><header><div><span class="tag">YOUR WEEK · YOUR PACE</span><h1>My Gym Guide</h1><p>Build consistency. Log your work. Learn each movement.</p><nav><button onclick="page='train';render()">Workout</button><button onclick="page='history';render()">History</button><button onclick="page='help';render()">Help & backup</button></nav></div></header><main id="app"></main><footer><span id="clock" role="timer">Rest ready</span><button onclick="timer(90)">90s</button><button onclick="timer(120)">120s</button><button onclick="timer(0)">Stop</button><span id="toast" role="status"></span></footer><script>
const EX={"chest": ["Seated chest press", "Chest \u00b7 triceps", ["Adjust handles to mid-chest; feet supported and back against the pad.", "Press forward with straight wrists; avoid arching your lower back.", "Return slowly without letting shoulders roll forward."], "Keep shoulders down; do not lock elbows.", "https://www.acefitness.org/resources/everyone/exercise-library/188/seated-chest-press/"], "row": ["Chest-supported machine row", "Back \u00b7 biceps", ["Adjust the chest pad and seat so you can reach the handles comfortably.", "Keep your chest on the pad and draw elbows back beside your ribs.", "Return slowly without rocking or reaching your shoulders forward."], "Keep your torso supported; do not lean back.", "https://www.acefitness.org/resources/everyone/exercise-library/168/seated-row/"], "leg": ["Seated leg press", "Quads \u00b7 glutes", ["Set your back and pelvis against the pad, with heels supported on the platform.", "Push smoothly through your feet without locking your knees.", "Lower only as far as you can keep your pelvis and lower back supported."], "Do not round your lower back or lift your hips off the seat.", "https://www.acefitness.org/resources/everyone/exercise-library/154/seated-leg-press/"], "pull": ["Lat pulldown", "Back \u00b7 biceps", ["Adjust the thigh pad and choose a comfortable grip.", "Pull toward the upper chest without swinging or pulling behind your neck.", "Return smoothly while keeping your torso steady."], "Ask staff to check your setup; do not jerk the weight.", ""], "curlleg": ["Seated leg curl", "Hamstrings", ["Ask staff to align the machine pivot with your knee and adjust the pads.", "Bend your knees smoothly while keeping your hips against the seat.", "Return with control without slamming the stack."], "Machine designs differ; check the machine instructions.", ""], "extend": ["Leg extension", "Quads", ["Align the machine pivot with your knee and place the roller above your ankles.", "Straighten your knees smoothly in a comfortable range.", "Lower with control while keeping your back against the pad."], "Avoid swinging or forcefully locking your knees.", ""], "raise": ["Dumbbell lateral raise", "Shoulders", ["Stand comfortably with light dumbbells at your sides.", "Raise your arms out slightly forward of your sides toward shoulder height.", "Lower slowly without shrugging or swinging."], "Use a light load and a comfortable shoulder range.", ""], "curl": ["Seated dumbbell curl", "Biceps", ["Sit upright with your back supported and arms at your sides.", "Bend your elbows without swinging or moving your shoulders forward.", "Lower the dumbbells slowly."], "Keep wrists comfortable and torso still.", ""], "push": ["Cable triceps pushdown", "Triceps", ["Face a high cable with elbows bent and close to your sides.", "Straighten your elbows while keeping your upper arms still.", "Return slowly without letting the stack slam."], "Avoid using body weight to push down.", ""], "calf": ["Seated calf raise", "Calves", ["Adjust the thigh pad and support the balls of your feet on the platform.", "Lift your heels smoothly without bouncing.", "Lower slowly through a comfortable ankle range."], "Have staff explain the safety catch before loading.", ""]},PLANS={"3": [["Full Body A", ["leg", "chest", "row", "curlleg", "curl"]], ["Full Body B", ["leg", "pull", "chest", "extend", "push"]], ["Full Body C", ["leg", "row", "curlleg", "raise", "calf"]]], "5": [["Upper A", ["chest", "row", "pull", "raise", "curl"]], ["Lower A", ["leg", "curlleg", "extend", "calf"]], ["Upper B", ["row", "chest", "pull", "raise", "push"]], ["Lower B", ["leg", "curlleg", "extend", "calf"]], ["Optional arms + easy cardio", ["curl", "push", "raise"]]]};const KEY='gym-guide-v2';let state={mode:'3',day:0,logs:{},sessions:[],swaps:{}},page='train',deadline=0;
try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){};
let active=null;let slides={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('toast').textContent='Saved on this device'}catch(e){document.getElementById('toast').textContent='Not saved — export a backup'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function session(){if(!active){active={id:Date.now().toString(),date:date(),name:PLANS[state.mode][state.day][0],mode:state.mode};state.sessions.push(active);save()}return active}
function key(id){return (active?active.id:'preview')+':'+id}
function log(id,i,f,v){session();let k=key(id);state.logs[k]??=Array.from({length:2},()=>({kg:'',reps:'',done:false}));state.logs[k][i][f]=v;save();updateProgress()}
function mode(v){state.mode=v;state.day=0;active=null;save();render()}
function choose(i){state.day=i;active=null;save();render()}
function last(id){let logs=Object.entries(state.logs).filter(([k])=>k.endsWith(':'+id)&&(!active||!k.startsWith(active.id+':')));let r=logs.at(-1);return r?r[1].map(x=>`${x.kg||'—'} lb × ${x.reps||'—'}`).join(' / '):'No previous sets yet'}
function updateProgress(){let all=active?Object.entries(state.logs).filter(([k])=>k.startsWith(active.id+':')).flatMap(([,v])=>v):[];let n=all.filter(s=>s.done).length;let p=document.getElementById('progress');if(p){p.value=n;document.getElementById('count').textContent=n+' sets checked'}}
function slide(id,step){slides[id]=Math.max(0,Math.min(2,(slides[id]||0)+step));document.getElementById('step-'+id).innerHTML='<span class="tag">STEP '+(slides[id]+1)+' OF 3</span><p>'+esc(EX[id][2][slides[id]])+'</p>'}
function card(id,i){let e=EX[id],rows=state.logs[key(id)]||[{},{ }];return `<article class="card"><span class="tag">${i+1} · ${esc(e[1])}</span><h2>${esc(e[0])}</h2><p>2 working sets · 8–12 reps${id==='raise'||id==='calf'?' (use a comfortable controlled range)':''} · rest 90–120 seconds</p><details><summary>Setup & movement walkthrough</summary><div class="step" id="step-${id}"><span class="tag">STEP 1 OF 3</span><p>${esc(e[2][0])}</p></div><div class="flex"><button onclick="slide('${id}',-1)">← Previous</button><button onclick="slide('${id}',1)">Next step →</button></div><p>Watch for: ${esc(e[3])}</p><p class="badge">No verified in-app video or animated demonstration is available in this version. Text steps are not a form assessment.</p>${e[4]?`<a target="_blank" rel="noopener" href="${e[4]}">Open exact-exercise ACE reference (internet required)</a>`:`<a target="_blank" rel="noopener" href="https://www.acefitness.org/resources/everyone/exercise-library/">Browse ACE library — find this exact exercise</a>`}</details><p class="muted">Previous: ${esc(last(id))}</p><table><thead><tr><th>Set</th><th>Weight (lb)</th><th>Reps</th><th>Done</th></tr></thead><tbody>${rows.map((r,n)=>`<tr><td>${n+1}</td><td><input aria-label="${esc(e[0])} set ${n+1} pounds" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(r.kg)}" onchange="log('${id}',${n},'kg',this.value)"></td><td><input aria-label="Set ${n+1} repetitions" type="number" min="0" max="100" inputmode="numeric" value="${esc(r.reps)}" onchange="log('${id}',${n},'reps',this.value)"></td><td><input aria-label="Set ${n+1} complete" type="checkbox" ${r.done?'checked':''} onchange="log('${id}',${n},'done',this.checked);if(this.checked)timer(90)"></td></tr>`).join('')}</tbody></table><details><summary>Equipment busy?</summary><p>Do another listed exercise first, then return. No automatic swaps are offered until matching equipment and demonstrations have been reviewed.</p></details></article>`}
function render(){let a=document.getElementById('app');slides={};if(page==='history'){a.innerHTML='<h2>Your sessions</h2><p>Logging a set starts a session. Records stay in this browser; use backups.</p>'+state.sessions.slice().reverse().map(s=>`<section><h3>${esc(s.name)}</h3><small>${esc(s.date)} · ${s.finished?'Finished':'Started / unfinished'}</small>${Object.entries(state.logs).filter(([k])=>k.startsWith(s.id+':')).map(([k,v])=>`<p>${esc(EX[k.split(':')[1]]?.[0]||'Exercise')}: ${v.map(x=>`${esc(x.kg||'—')} lb × ${esc(x.reps||'—')} ${x.done?'✓':''}`).join(' / ')}</p>`).join('')}</section>`).join('');return}
if(page==='help'){a.innerHTML=`<h2>Help, safety & backups</h2><section><h3>First version: what is included</h3><p>Three-/five-day plans, set logging, history, rest timer, written step cards and optional offline caching. Videos, verified animations, picture sequences, cloud sync and automatic substitutions are not included.</p><p>Do not use this as rehabilitation advice. If your lower back is currently painful, do not push through or test heavy loads; obtain individual advice. Ask a trainer to check machine setup and unfamiliar exercises.</p><p>These are general adult starter templates, not a medical or individualized training prescription. Body-fat targets, calorie prescriptions and fixed calorie-burn estimates are intentionally omitted.</p></section><section><h3>Progression</h3><p>Start with a manageable load that lets you keep control and finish with a few repetitions still possible. Once both sets reach the top of the range comfortably with consistent form, consider the smallest available weight increase. Never increase just to beat a number.</p><h3>Reference material</h3><p><a href="https://acsm.org/wp-content/uploads/2026/03/Resistance-Training-Position-Stand-infographic.pdf" target="_blank" rel="noopener">ACSM resistance-training overview</a></p><p><a href="https://www.acefitness.org/resources/everyone/exercise-library/" target="_blank" rel="noopener">ACE exercise library</a></p><p>Exact ACE sources are linked on chest press, machine row and seated leg press. Other text cues are general starting instructions, not individually verified media. No third-party images have been copied.</p></section><section><h3>Your data</h3><p>Logs are stored locally, not in GitHub. They do not sync across devices and can be lost if browser data is cleared. Export regularly. Backup files contain personal workout records; keep them private.</p><button onclick="backup()">Export backup</button><p><label>Restore backup (replaces current data)<input type="file" accept="application/json,.json" onchange="restore(this.files[0])"></label></p></section><section><h3>iPhone installation</h3><p>After publishing, open the site in Safari, use Share → Add to Home Screen, and enable Open as Web App if offered.</p><p>Offline requires a successful first visit on HTTPS. Reopen once online after installation. External references need internet. Offline availability can vary if device storage is cleared.</p></section>`;return}
let list=PLANS[state.mode],d=list[state.day];a.innerHTML=`<section><label>How many days this week?<select onchange="mode(this.value)"><option value="3" ${state.mode==='3'?'selected':''}>3 days · Full body</option><option value="5" ${state.mode==='5'?'selected':''}>5 days · Upper/lower + optional day</option></select></label><p class="muted">${state.mode==='3'?'Example: Mon / Wed / Fri. Keep a rest day between sessions.':'Example: Mon upper / Tue lower / Wed rest / Thu upper / Fri lower / Sat optional / Sun rest.'}</p><nav>${list.map((d,i)=>`<button class="${i===state.day?'active':''}" onclick="choose(${i})">${i+1}. ${esc(d[0])}</button>`).join('')}</nav></section><h2>${esc(d[0])}</h2><p>Plan around 45–60 minutes including warm-up and optional easy cardio. This is a planning estimate, not a time requirement.</p><section class="notice"><h3>Before you start</h3><p>5–8 minutes of easy movement, then light practice sets on the first machines. Practice sets are not logged as working sets. Stop for sharp or increasing pain; do not train through a lower-back tweak.</p><p>Choose loads you control. Finish with a few reps still possible. No need to train to failure.</p></section><section><span id="count">0 sets checked</span><progress id="progress" max="${d[1].length*2}" value="0"></progress><p>${active?'Current session started':'Your first entry starts a new session.'}</p></section>${d[1].map(card).join('')}<section><h3>Optional finish</h3><p>5–15 minutes of comfortable walking, cycling or elliptical if time and energy allow. Skip the extra cardio rather than rush your lifting.</p><button class="primary" onclick="finish()">Finish session & next workout →</button><p id="status" role="status"></p></section>`;updateProgress()}
function finish(){session();active.finished=true;save();active=null;state.day=(state.day+1)%PLANS[state.mode].length;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function timer(n){deadline=n?Date.now()+n*1000:0;tick()}
function tick(){let c=document.getElementById('clock');if(!deadline){c.textContent='Rest ready';return}let t=Math.max(0,Math.ceil((deadline-Date.now())/1000));c.textContent=t?`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')} rest`:'Rest complete';if(!t)deadline=0}setInterval(tick,500);
function backup(){const url=URL.createObjectURL(new Blob([JSON.stringify({version:2,data:state},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='gym-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restore(file){if(!file)return;try{if(file.size>5000000)throw Error('File too large');let b=JSON.parse(await file.text()),v=b.data;if(b.version!==2||!v||!['3','5'].includes(v.mode)||!Array.isArray(v.sessions)||!v.logs||typeof v.logs!=='object'||!Number.isInteger(v.day)||v.day<0||v.day>=PLANS[v.mode].length)throw Error('Invalid backup');if(!confirm('Replace current workout records with this backup?'))return;state=v;active=null;save();page='history';render()}catch(e){alert('Could not restore backup: '+e.message)}}
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
